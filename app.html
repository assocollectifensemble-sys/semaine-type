<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Semaine">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap">
<title>Semaine — Éloha &amp; Aël</title>
<style>
:root{
  /* charte École Yoga Doula : orange #F8982B, corail #F2753B, turquoise #1DB8B8,
     bleu-vert #478D9C, encre #1D5966, terre #894035 — police Raleway */
  --papa:#1D5966;  --papa-s:#e2f1f4;
  --maman:#F2753B; --maman-s:#ffece2;
  --duo:#1DB8B8;   --duo-s:#daf8f8;
  --gaelle:#7FA93B;--gaelle-s:#f0f7e2;
  --mamie:#B0559B; --mamie-s:#fbe9f7;
  --grapho:#F8982B;--grapho-s:#fff2df;
  --amie:#478D9C;  --amie-s:#e7f3f6;
  --autre:#8C8378; --autre-s:#f4f2ef;
  --ink:#173238; --ink2:#365a64; --mut:#6b8289;
  --bg:#fdf8f1; --surf:#ffffff; --surf2:#fffaf3;
  --line:#efe1d1; --line2:#ddcab5;
  --ok:#7FA93B; --warn:#F2753B;
  --accent:#F8982B; --accent2:#1DB8B8;
  --rad:16px; --rad-s:11px;
  --row:28px; --gut:12px;
  --sh1:0 1px 2px rgba(29,89,102,.07),0 1px 3px rgba(29,89,102,.05);
  --sh2:0 4px 16px rgba(29,89,102,.12),0 1px 3px rgba(29,89,102,.07);
  --sh3:0 16px 44px rgba(29,89,102,.24);
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:calc(58px + var(--safe-b));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 Raleway,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  font-feature-settings:"cv11","ss01";letter-spacing:-.005em;
  overscroll-behavior-y:none;padding-bottom:var(--nav-h)}
h1,h2,h3,h4{margin:0;font-weight:640;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer;background:none;border:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--gut)}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}

/* ───── header ───── */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px;padding:9px var(--gut) 9px;max-width:1180px;margin:0 auto}
.htxt{flex:1;min-width:0}
.htxt h1{font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.htxt p{margin:0;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  border:1px solid var(--line2);background:var(--surf);box-shadow:var(--sh1);font-size:16px;line-height:1;
  transition:transform .12s,background .12s}
.ib:active{transform:scale(.93)}
.ib[disabled]{opacity:.35}
.ib.accent{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:9px;background:var(--warn);
  color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.rel{position:relative}

/* segmented */
.seg2{display:flex;gap:3px;background:var(--surf2);border:1px solid var(--line);
  padding:3px;border-radius:12px;margin:0 var(--gut) 9px;max-width:1180px}
.seg2 button{flex:1;padding:8px 6px;border-radius:9px;font-size:13.5px;font-weight:550;color:var(--mut);
  transition:background .15s,color .15s}
.seg2 button[aria-selected=true]{background:var(--surf);color:var(--ink);box-shadow:var(--sh1)}

/* chips versions */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px var(--gut) 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chipwrap{position:relative}
.chipwrap::after{content:'';position:absolute;top:0;right:0;bottom:10px;width:26px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--bg) 78%)}
.chip{flex:0 0 auto;scroll-snap-align:start;padding:7px 12px;border-radius:12px;background:var(--surf);
  border:1px solid var(--line);box-shadow:var(--sh1);text-align:left;transition:transform .12s}
.chip:active{transform:scale(.97)}
.chip b{display:block;font-size:13px;font-weight:600}
.chip small{display:block;font-size:11px;color:var(--mut);margin-top:1px}
.chip[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--bg);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 18%,transparent),var(--sh2)}
.chip[aria-selected=true] b::after{content:' ✓';font-size:11px;opacity:.85}
.chip[aria-selected=true] small{color:color-mix(in srgb,var(--bg) 72%,var(--ink))}
.chip.gh{border-style:dashed;box-shadow:none;background:transparent;color:var(--mut);display:grid;place-items:center;min-width:46px;font-size:19px}

.rotate-hint{display:none;align-items:center;gap:8px;margin:0 var(--gut) 9px;padding:10px 12px;
  background:color-mix(in srgb,var(--accent) 20%,var(--surf));border:1.5px solid color-mix(in srgb,var(--accent) 55%,transparent);
  border-radius:12px;font-size:12.5px;color:var(--ink2);font-weight:550}
.rotate-hint button{margin-left:auto;background:transparent;border:0;color:var(--mut);font-size:15px;padding:2px 4px}
@media (orientation:portrait) and (max-width:560px){ .rotate-hint.show{display:flex} }

/* hiérarchie : planning au premier plan, outils en retrait */
.fold{background:transparent;border:1px solid var(--line);border-radius:var(--rad);
  margin:0 var(--gut) 9px;overflow:hidden}
.fold>summary{list-style:none;cursor:pointer;padding:11px 13px;font-size:13.5px;font-weight:650;
  color:var(--ink2);display:flex;align-items:center;gap:7px;background:var(--surf2)}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:'⌄';margin-left:auto;font-size:15px;color:var(--mut);transition:transform .18s}
.fold[open]>summary::after{transform:rotate(180deg)}
.fold>*:not(summary){margin:10px var(--gut) 12px}
.fold .panel{border:0;box-shadow:none;background:transparent;padding:0;margin-top:0}
.tools{opacity:.9}
.seg2.tools{background:transparent;border-color:var(--line)}
.leg.tools{display:flex;flex-wrap:wrap;gap:5px;padding:0 var(--gut) 10px;opacity:.82}

/* ───── cards / stats ───── */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:11px}
.st{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);padding:11px 12px;box-shadow:var(--sh1);position:relative;overflow:hidden}
.st::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--c,transparent)}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 6px}
.pill{font-style:normal;font-size:10.5px;font-weight:600;padding:2.5px 6px;border-radius:7px;
  background:color-mix(in srgb,var(--c,var(--ink)) 13%,transparent);color:var(--ink2);white-space:nowrap}
.pill.nil{background:var(--surf2);color:var(--mut);font-weight:500}
.st .sub{display:block;font-size:10.5px;color:var(--mut)}
.st .k{font-size:11px;color:var(--mut);font-weight:550;text-transform:uppercase;letter-spacing:.05em;display:block}
.st .v{font-size:26px;font-weight:660;letter-spacing:-.035em;display:block;margin:1px 0 0;font-variant-numeric:tabular-nums}
.st .v em{font-style:normal;font-size:13px;font-weight:550;color:var(--mut);letter-spacing:-.01em}
.st .s{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.35}
.st.w{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
.st.w .v{font-size:20px}
.tag{display:inline-block;font-size:11px;font-weight:550;padding:2px 8px;border-radius:20px;
  background:var(--surf2);border:1px solid var(--line);color:var(--ink2)}
.tag.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:color-mix(in srgb,var(--ok) 34%,transparent);color:var(--ok)}
.tag.no{background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:color-mix(in srgb,var(--warn) 34%,transparent);color:var(--warn)}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh1);padding:13px;margin-bottom:11px}
.panel>h3{font-size:13.5px;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.panel>h3 .tag{margin-left:auto}

/* ───── légende ───── */
.leg{display:flex;flex-wrap:wrap;gap:6px}
.lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);
  background:var(--surf2);border:1px solid var(--line);border-radius:20px;padding:3px 9px 3px 4px}
.dot{width:19px;height:19px;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;flex:0 0 auto}

/* ───── grille semaine ───── */
.gwrap{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh1);overflow:hidden}
.gscroll{overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 210px)}
.grid{display:grid;grid-template-columns:34px repeat(7,minmax(var(--colw,104px),1fr));
  min-width:calc(34px + 7*var(--colw,104px));position:relative}
/* téléphone à l'horizontale : la semaine entière tient à l'écran, sans défilement */
@media (orientation:landscape) and (max-height:520px){
  :root{--row:19px;--gut:9px;--nav-h:calc(46px + var(--safe-b))}
  .grid{--colw:0px;min-width:100%}
  /* en paysage, seul le planning compte : tout le reste se replie */
  header{padding-top:4px}
  header .htxt p,#viewChips,.rotate-hint,.fold,.leg,.seg2.tools{display:none!important}
  header h1{font-size:16px}
  nav button{font-size:10px}
  nav .ni{font-size:15px}
  .ev{font-size:10px;padding:2px 4px;line-height:1.25}
  .gh .dn{font-size:13px}
  /* la grille occupe exactement la hauteur libre : en-tête et onglets restent fixes */
  .gscroll{max-height:calc(100dvh - 61px - var(--nav-h) - 8px);overflow-y:auto}
  header{position:sticky;top:0;z-index:20}
  .sp{display:none}
  main.wrap{padding-bottom:0}
}
@media (max-width:430px){ .grid{--colw:86px} }
.gh{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--surf) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:7px 6px 6px;text-align:center}
.gh.corner{z-index:8;border-right:1px solid var(--line)}
.gh b{font-size:12px;font-weight:620;display:block}
.gh .dn{font-size:17px;font-weight:660;letter-spacing:-.03em;display:block;margin-top:-1px}
.gh .duty{display:inline-flex;gap:2px;margin-top:3px}
.gh .duty i{width:15px;height:15px;border-radius:5px;font-size:9px;font-weight:800;color:#fff;
  display:grid;place-items:center;font-style:normal}
.gh.today b,.gh.today .dn{color:var(--papa)}
.gh.today::after{content:'';position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
  width:22px;height:2.5px;border-radius:2px;background:var(--papa)}
.gh.we{background:color-mix(in srgb,var(--surf2) 94%,transparent)}
.hcol{border-right:1px solid var(--line);background:var(--surf2)}
.hcell{height:var(--row);position:relative}
.hcell span{position:absolute;top:-6px;right:5px;font-size:9.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.col{position:relative;border-right:1px solid var(--line);touch-action:pan-y}
.col.we{background:color-mix(in srgb,var(--surf2) 55%,transparent)}
.slot{height:var(--row);border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.slot.hr{border-bottom-color:var(--line)}
.nap{position:absolute;left:0;right:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(135deg,#faf3e8,#faf3e8 5px,#f1e5d3 5px,#f1e5d3 10px)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--maman);z-index:7;pointer-events:none}
.nowline::before{content:'';position:absolute;left:-1px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--maman)}
.ghost{position:absolute;left:3px;right:3px;border:2px dashed var(--ink2);border-radius:9px;z-index:8;
  background:color-mix(in srgb,var(--ink) 7%,transparent);pointer-events:none;
  display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink2)}

/* bloc */
.ev{position:absolute;left:2px;right:2px;border-radius:9px;padding:3px 6px 3px 7px;overflow:hidden;
  background:var(--s);border-left:3.5px solid var(--c);z-index:2;
  touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:0 1px 2px rgba(16,19,24,.07);transition:box-shadow .15s,transform .15s}
.ev .t{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:620;line-height:1.25}
.ev .t .em{font-size:10.5px}
.ev .t b{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  word-break:break-word;hyphens:auto;line-height:1.2}
/* bloc court : une seule ligne, sinon le texte déborde du cadre */
.ev.tiny .t b{-webkit-line-clamp:1;white-space:nowrap;text-overflow:ellipsis}
.ev.tiny .m{display:none}
.ev.tiny .t{font-size:10px}
.ev .m{font-size:9.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.ev .kb{display:inline-block;font-size:8.5px;font-weight:800;padding:0 3px;border-radius:4px;
  background:var(--c);color:#fff;flex:0 0 auto;letter-spacing:.02em}
.ev.mini{padding:1px 5px}
.ev.mini .m{display:none}
.ev .grip{position:absolute;left:0;right:0;bottom:0;height:13px;cursor:ns-resize;touch-action:none}
.ev .grip::after{content:'';position:absolute;left:50%;bottom:2.5px;transform:translateX(-50%);
  width:20px;height:3px;border-radius:3px;background:color-mix(in srgb,var(--c) 55%,transparent)}
.ev.lift{box-shadow:var(--sh3);transform:scale(1.035);z-index:20;opacity:.96}
.ev.new{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

/* ───── vue jour ───── */
.dcard{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh1);margin-bottom:10px;overflow:hidden}
.dhead{display:flex;align-items:center;gap:9px;padding:11px 13px 9px}
.dhead .dd{width:38px;height:38px;border-radius:11px;background:var(--surf2);border:1px solid var(--line);
  display:grid;place-items:center;line-height:1;flex:0 0 auto}
.dhead .dd b{font-size:15px;font-weight:660}
.dhead .dd small{font-size:8.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.dhead.today .dd{background:var(--papa);border-color:var(--papa);color:#fff}
.dhead.today .dd small{color:#fff;opacity:.8}
.dhead .dt{flex:1;min-width:0}
.dhead .dt b{font-size:14.5px;display:block}
.dhead .dt span{font-size:11.5px;color:var(--mut)}
.hsec{border-top:1px solid var(--line);padding:9px 13px 11px}
.hsec>.hh{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.hsec>.hh .lb{font-size:10.5px;font-weight:620;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.triple{display:flex;gap:3px;margin-left:auto;background:var(--surf2);border:1px solid var(--line);padding:2px;border-radius:10px}
.triple button{padding:5px 9px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--mut);white-space:nowrap}
.triple button[aria-pressed=true]{color:#fff;box-shadow:var(--sh1)}
.triple button[aria-pressed=true][data-v=papa]{background:var(--papa)}
.triple button[aria-pressed=true][data-v=maman]{background:var(--maman)}
.triple button[aria-pressed=true][data-v=duo]{background:var(--duo)}
.triple button[aria-pressed=true][data-v=mamie]{background:var(--mamie)}
.item{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--rad-s);
  background:var(--s);border:1px solid color-mix(in srgb,var(--c) 22%,transparent);
  border-left:3.5px solid var(--c);margin-bottom:7px;text-align:left;width:100%;transition:transform .12s}
.item:active{transform:scale(.985)}
.item .ic{width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;
  font-size:15px;flex:0 0 auto}
.item .bd{flex:1;min-width:0}
.item .bd b{display:block;font-size:13.5px;font-weight:600}
.item .bd span{display:block;font-size:11.5px;color:var(--ink2);margin-top:1px}
.item .rt{text-align:right;flex:0 0 auto;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;line-height:1.35}
.item .rt b{display:block;font-size:12.5px;color:var(--ink);font-weight:620}
.addrow{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:9px;
  border:1.5px dashed var(--line2);border-radius:var(--rad-s);color:var(--mut);font-size:12.5px;font-weight:550}
.addrow:active{background:var(--surf2)}
.freeline{display:flex;gap:6px;flex-wrap:wrap;margin:1px 0 8px}
.fl{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;display:inline-flex;gap:5px;align-items:center}
.fl.p{background:var(--papa-s);color:var(--papa)}
.fl.m{background:var(--maman-s);color:var(--maman)}
.fl.d{background:var(--duo-s);color:var(--duo)}

/* ───── à venir ───── */
.wk{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);
  border-radius:var(--rad);background:var(--surf);box-shadow:var(--sh1);margin-bottom:8px;width:100%;text-align:left}
.wk .cal{width:44px;height:44px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);
  display:grid;place-items:center;line-height:1.05;flex:0 0 auto}
.wk .cal b{font-size:16px;font-weight:660}
.wk .cal small{font-size:8.5px;text-transform:uppercase;color:var(--mut);letter-spacing:.06em}
.wk .bd{flex:1;min-width:0}
.wk .bd b{display:block;font-size:14px}
.wk .bd span{display:block;font-size:11.5px;color:var(--mut);margin-top:1px}
.wk.cur{border-color:var(--papa);box-shadow:0 0 0 1px var(--papa),var(--sh1)}
.wk.empty{border-style:dashed;box-shadow:none;background:transparent}
.wk.empty .cal{background:transparent;border-style:dashed}
.steps{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--mut);margin-top:6px}
.dotv{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.dotv.on{background:var(--ok)}

/* ───── alertes ───── */
.alert{display:flex;gap:9px;padding:10px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);line-height:1.45}
.alert:first-of-type{border-top:0;padding-top:2px}
.alert .ai{flex:0 0 auto;font-size:14px;line-height:1.2}
.alert b{color:var(--ink)}
.alert.good b{color:var(--ok)}

/* ───── bottom nav ───── */
nav{position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:color-mix(in srgb,var(--surf) 92%,transparent);
  backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b);display:flex}
nav button{flex:1;padding:8px 2px 7px;display:grid;justify-items:center;gap:2px;color:var(--mut);font-size:10.5px;font-weight:550}
nav button .ni{font-size:19px;line-height:1.1}
nav button[aria-selected=true]{color:var(--ink)}
nav button[aria-selected=true] .ni{transform:translateY(-1px)}
.fab{position:fixed;right:calc(var(--gut) + 2px);bottom:calc(var(--nav-h) + 12px);z-index:46;
  width:54px;height:54px;border-radius:18px;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;font-size:26px;box-shadow:var(--sh2);transition:transform .14s}
.fab:active{transform:scale(.92)}

/* ───── sheet ───── */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet .veil{position:absolute;inset:0;background:rgba(10,12,16,.42);opacity:0;transition:opacity .22s}
.sheet.on .veil{opacity:1}
.sheet .pane{position:absolute;left:0;right:0;bottom:0;background:var(--surf);border-radius:20px 20px 0 0;
  max-height:93vh;overflow-y:auto;box-shadow:var(--sh3);
  padding:6px 16px calc(18px + var(--safe-b));transform:translateY(12px);transition:transform .24s cubic-bezier(.22,1,.36,1)}
.sheet.on .pane{transform:none}
@media(min-width:720px){.sheet .pane{left:50%;right:auto;transform:translateX(-50%) translateY(12px);
  width:600px;bottom:18px;border-radius:20px}.sheet.on .pane{transform:translateX(-50%)}}
.grab{width:36px;height:4px;border-radius:3px;background:var(--line2);margin:5px auto 12px}
.sh-h{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.sh-h h3{font-size:17px;flex:1}
.fld{margin-bottom:13px}
.fld>label{display:block;font-size:10.5px;font-weight:620;color:var(--mut);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--surf2);border:1.5px solid var(--line);
  border-radius:12px;padding:12px;font-size:16px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--ink2);background:var(--surf)}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opts button{border:1.5px solid var(--line);background:var(--surf2);border-radius:12px;
  padding:10px 12px;font-size:13.5px;font-weight:550;display:flex;align-items:center;gap:7px;flex:1 1 auto;min-height:46px}
.opts.g2 button{flex:1 1 calc(50% - 4px)}
.opts.g3 button{flex:1 1 calc(33.3% - 5px);justify-content:center}
.opts.g7 button{flex:1 1 calc(14.2% - 6px);justify-content:center;padding:10px 4px;min-width:40px}
.opts button[aria-pressed=true]{border-color:var(--c,var(--ink));background:var(--s,var(--ink));
  color:var(--cc,var(--bg));font-weight:620}
.opts button .dot{width:20px;height:20px;border-radius:7px}
.duo2{display:flex;gap:10px}.duo2>*{flex:1}
.step{display:flex;align-items:center;background:var(--surf2);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.step button{width:46px;height:46px;font-size:20px;color:var(--ink2);display:grid;place-items:center}
.step button:active{background:var(--line)}
.step span{flex:1;text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:9px;margin-top:6px}
.bt{flex:1;border:1.5px solid var(--line2);background:var(--surf);border-radius:13px;padding:14px;
  font-size:15px;font-weight:600;min-height:50px}
.bt.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bt.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%,transparent);flex:0 0 auto;padding:14px 18px}
.bt:active{transform:scale(.985)}
.mlist{display:flex;flex-direction:column}
.mlist button{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);
  text-align:left;font-size:15px}
.mlist button:last-child{border-bottom:0}
.mlist button .mi{width:34px;height:34px;border-radius:10px;background:var(--surf2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.mlist button div{flex:1;min-width:0}
.mlist button small{display:block;color:var(--mut);font-size:12px;font-weight:400;margin-top:1px}
.hint{font-size:12.5px;color:var(--mut);line-height:1.5;margin:0 0 13px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv b{font-variant-numeric:tabular-nums}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);z-index:80;
  bottom:calc(var(--nav-h) + 16px);background:var(--ink);color:var(--bg);border-radius:14px;
  padding:11px 14px;font-size:13.5px;font-weight:550;box-shadow:var(--sh2);display:flex;align-items:center;gap:12px;
  opacity:0;transition:.2s;pointer-events:none;max-width:calc(100vw - 24px)}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:var(--bg);font-weight:700;font-size:13.5px;text-decoration:underline;flex:0 0 auto}

details>summary{font-size:13px;font-weight:620;cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'▾';margin-left:auto;color:var(--mut);transition:transform .2s}
details[open]>summary::after{transform:rotate(180deg)}
details .body{font-size:12.5px;color:var(--ink2);line-height:1.55;padding-top:9px}
details .body b{color:var(--ink)}
.sp{height:6px}
@media print{
  header,nav,.fab,.seg2,.chips,.sheet,.toast,.noprint{display:none!important}
  body{background:#fff;padding:0}
  .gscroll{overflow:visible;max-height:none}.grid{min-width:0}
}
</style>

<body>

<header>
  <div class="hrow">
    <div class="htxt"><h1 id="hTitle">Semaine</h1><p id="hSub">—</p></div>
    <button class="ib" id="bUndo" title="Annuler" disabled>↩︎</button>
    <button class="ib" id="bShare" title="Partager">↗</button>
    <button class="ib" id="bMenu" title="Menu">⋯</button>
  </div>
</header>

<div id="viewChips"></div>
<div class="rotate-hint" id="rot">📱 Tourne ton téléphone : la semaine entière tient à l'écran<button id="rotX">✕</button></div>

<main class="wrap" id="main"></main>

<button class="fab" id="fab" title="Ajouter un bloc">+</button>

<nav>
  <button data-tab="plan" aria-selected="true"><span class="ni">▦</span>Planning</button>
  <button data-tab="cmp"><span class="ni">⇄</span>Comparer</button>
  <button data-tab="next"><span class="ni">🗓</span>À venir</button>
</nav>

<div class="sheet" id="sheet"><div class="veil"></div><div class="pane" id="pane"></div></div>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastAct" hidden>Annuler</button></div>

<script>
'use strict';
/*═══════════ constantes ═══════════*/
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const D3=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const D1=['L','M','M','J','V','S','D'];
const T0=7*60,T1=20*60+30,MID=13*60,STEP=15,SNAP=15,ROW=28,NAP=[12*60+30,14*60+30];
const KEY='semaine-v3';

const WHO={
  papa  :{n:'Papa',   s:'P',  v:'--papa'},
  maman :{n:'Maman',  s:'M',  v:'--maman'},
  duo   :{n:'Tous les deux', s:'P+M', v:'--duo'},
  gaelle:{n:'Gaëlle', s:'G',  v:'--gaelle'},
  mamie :{n:'Mamie',  s:'Ma', v:'--mamie'},
  grapho:{n:'Grapho', s:'Gr', v:'--grapho'},
  amie  :{n:'Amie',   s:'A',  v:'--amie'},
  autre :{n:'Autre',  s:'?',  v:'--autre'}
};
const PARENTS=['papa','maman','duo','mamie'];
const PAID={gaelle:180,grapho:140,amie:0,mamie:0,autre:0};
const KIND={
  ecole    :{n:'École',    e:'📘'},
  activite :{n:'Activité', e:'🤸'},
  garde    :{n:'Garde',    e:'🧸'},
  perso    :{n:'Perso',    e:'☕'},
  famille  :{n:'En famille',e:'🏡'}
};
const KIDS={eloha:{n:'Éloha',s:'É'},ael:{n:'Aël',s:'A'},both:{n:'Les deux',s:'É+A'}};

let uid=1;
const nid=p=>(p||'b')+Date.now().toString(36).slice(-5)+(uid++).toString(36);
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+'h'+String(Math.round(m%60)).padStart(2,'0');
const hmz=m=>{const h=Math.floor(m/60),x=Math.round(m%60);return x?h+'h'+String(x).padStart(2,'0'):h+'h'};
const dur=m=>{const h=Math.floor(m/60),x=Math.round(m%60);return h?(x?h+'h'+String(x).padStart(2,'0'):h+'h'):x+'min'};
const cvar=w=>'var('+WHO[w].v+')';
const svar=w=>'var('+WHO[w].v+'-s)';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n||8)}catch(e){}};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function monday(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+7*(off||0));return d}
const parseD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const fdate=(d,o)=>d.toLocaleDateString('fr-FR',o||{day:'numeric',month:'long'});

/*═══════════ presets ═══════════*/
function mk(day,start,len,label,kind,owner,kids,cost,trip){
  return{id:nid(),day,start,len,label,kind,owner,kids:kids||'eloha',cost:cost||0,trip:trip||0}}
const school=(d,s,l,o)=>mk(d,s,l,'École','ecole',o,'eloha');
const grapho=d=>mk(d,540,60,'Grapho','ecole','grapho','eloha',140);
const gaelle=(d,s)=>mk(d,s||570,180,'Gaëlle','garde','gaelle','both',180);
const DUTY=()=>({0:{am:'papa',pm:'maman'},1:{am:'papa',pm:'maman'},2:{am:'maman',pm:'papa'},
  3:{am:'papa',pm:'maman'},4:{am:'maman',pm:'maman'},5:{am:'maman',pm:'papa'},6:{am:'papa',pm:'duo'}});
/* répartitions équilibrées (recherche exhaustive : max de demi-journées ≥3h pour les deux,
   écart de garde minimal, pas de journée de garde > 10h) */
const DUTY_OPT={
 light  :{0:{am:'papa',pm:'duo'},1:{am:'maman',pm:'maman'},2:{am:'maman',pm:'papa'},3:{am:'papa',pm:'duo'},4:{am:'maman',pm:'papa'},5:{am:'papa',pm:'maman'},6:{am:'duo',pm:'duo'}},
 middle :{0:{am:'maman',pm:'duo'},1:{am:'maman',pm:'maman'},2:{am:'papa',pm:'papa'},3:{am:'maman',pm:'duo'},4:{am:'papa',pm:'maman'},5:{am:'papa',pm:'papa'},6:{am:'duo',pm:'duo'}},
 full   :{0:{am:'maman',pm:'duo'},1:{am:'papa',pm:'papa'},2:{am:'papa',pm:'maman'},3:{am:'maman',pm:'duo'},4:{am:'maman',pm:'maman'},5:{am:'papa',pm:'papa'},6:{am:'duo',pm:'duo'}},
 propose:{0:{am:'duo',pm:'duo'},1:{am:'maman',pm:'papa'},2:{am:'papa',pm:'maman'},3:{am:'maman',pm:'duo'},4:{am:'maman',pm:'maman'},5:{am:'papa',pm:'papa'},6:{am:'duo',pm:'duo'}}
};

function core(){return[
  school(1,510,60,'papa'),  mk(1,900,240,'Ninja','activite','maman','eloha',0,60),
  school(2,510,60,'maman'), mk(2,780,120,'Hip hop','activite','papa','eloha',0,45),
  school(3,510,60,'papa'),
  school(4,510,60,'maman'), mk(4,780,180,'Skate + batterie','activite','amie','both',0,0),
  school(5,510,30,'papa'),  mk(5,780,120,'Ninja','activite','papa','eloha',0,45),
  ]}


/* Règle de vie : une demi-journée sans activité ni école, c'est « tous les deux ».
   Les demi-journées qui portent une activité gardent le parent désigné. */
function duoParDefaut(pl){
  for(let d=0;d<7;d++){
    ['am','pm'].forEach(hd=>{
      const occupe=pl.blocks.some(b=>b.day===d &&
        (hd==='am' ? b.start<MID : b.start+b.len>MID) &&
        (b.kind==='ecole'||b.kind==='activite'||b.kind==='garde'));
      if(!occupe) pl.duty[d][hd]='duo';
    });
  }
  return pl;
}

function presets(){
  const P={};
  const li=core();li.push(grapho(0));
  li.find(b=>b.day===1&&b.label==='Ninja').kids='both';
  P.light={name:'Light',kind:'type',blocks:li,duty:JSON.parse(JSON.stringify(DUTY_OPT.light))};

  const mi=core();mi.push(grapho(0),gaelle(4));
  mi.find(b=>b.day===1&&b.label==='Ninja').kids='both';
  P.middle={name:'Middle',kind:'type',blocks:mi,duty:JSON.parse(JSON.stringify(DUTY_OPT.middle))};

  const fu=core().filter(b=>!(b.day===1&&b.kind==='ecole'));
  fu.push(grapho(0),grapho(1),gaelle(4));
  fu.find(b=>b.day===1&&b.label==='Ninja').kids='both';
  P.full={name:'Full option',kind:'type',blocks:fu,duty:JSON.parse(JSON.stringify(DUTY_OPT.full))};

  const pr=core();pr.push(gaelle(1),gaelle(4));
  pr.find(b=>b.day===1&&b.label==='Ninja').kids='both';
  pr.find(b=>b.label==='Hip hop').kids='both';
  pr.find(b=>b.day===5&&b.label==='Ninja').kids='both';
  const i=pr.findIndex(b=>b.day===6);if(i>-1)pr.splice(i,1);
  pr.push(mk(6,600,180,'Sortie tous les 4','famille','duo','both'));
  P.propose={name:'Proposée',kind:'type',blocks:pr,duty:JSON.parse(JSON.stringify(DUTY_OPT.propose))};

  P.blank={name:'Page blanche',kind:'type',blocks:[],duty:DUTY()};
  Object.keys(P).forEach(k=>{P[k].meta={vj:false,va:false,note:''};duoParDefaut(P[k])});
  return P;
}

/*═══════════ state ═══════════*/
let S=boot(),tab='plan',gridMode=(innerWidth>820),undoStack=[];
function boot(){
  try{const r=JSON.parse(localStorage.getItem(KEY));
    if(r&&r.v===3){uid=r.uid||900;return r}}catch(e){}
  return{v:3,uid:900,active:'middle',order:['light','middle','full','propose','blank'],plans:presets(),tab:'plan'};
}
const save=()=>{S.uid=uid;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const P=()=>S.plans[S.active]||S.plans[S.order[0]];
const clone=o=>JSON.parse(JSON.stringify(o));
function snap(){undoStack.push({a:S.active,p:clone(P())});if(undoStack.length>25)undoStack.shift();$('bUndo').disabled=false}
function undo(){const u=undoStack.pop();if(!u)return;S.plans[u.a]=u.p;S.active=u.a;$('bUndo').disabled=!undoStack.length;save();paint();toast('Annulé')}
let tT;
function toast(msg,act){
  $('toastTxt').textContent=msg;const b=$('toastAct');
  if(act){b.hidden=false;b.textContent=act.label;b.onclick=()=>{act.fn();hideToast()}}else b.hidden=true;
  $('toast').classList.add('on');clearTimeout(tT);tT=setTimeout(hideToast,act?4200:2000);
}
const hideToast=()=>$('toast').classList.remove('on');

/*═══════════ moteur ═══════════*/
function engine(pl){
  const N=(T1-T0)/30,slots=[],free={papa:0,maman:0},load={papa:0,maman:0};
  let both=0,none=0,fam=0;
  for(let d=0;d<7;d++)for(let i=0;i<N;i++){
    const t=T0+i*30,hd=t<MID?'am':'pm';
    const on=(pl.duty[d]&&pl.duty[d][hd])||'papa';
    const busy={papa:false,maman:false},cov={eloha:null,ael:null};
    let tog=false;
    pl.blocks.forEach(b=>{
      if(b.day!==d||b.start>=t+30||b.start+b.len<=t)return;
      if(b.owner==='duo'){busy.papa=busy.maman=true;tog=true}
      else if(b.owner==='papa'||b.owner==='maman')busy[b.owner]=true;
      if(b.kind==='perso')return;
      if(b.kids==='both'){cov.eloha=cov.eloha||b.owner;cov.ael=cov.ael||b.owner}
      else cov[b.kids]=cov[b.kids]||b.owner;
    });
    if(!cov.eloha||!cov.ael){
      /* Mamie prend le relais : les deux parents sont libres sur ce créneau */
      if(on==='mamie'){}
      else if(on==='duo'){busy.papa=busy.maman=true;tog=true}
      else busy[on]=true;
    }
    const fp=!busy.papa,fm=!busy.maman;
    slots.push({d,t,hd,fp,fm});
    fp?free.papa+=30:load.papa+=30;
    fm?free.maman+=30:load.maman+=30;
    if(fp&&fm)both+=30; if(!fp&&!fm)none+=30; if(tog)fam+=30;
  }
  const runs={papa:[],maman:[]},duoRuns=[];
  for(let d=0;d<7;d++)['am','pm'].forEach(hd=>{
    const sl=slots.filter(s=>s.d===d&&s.hd===hd);
    ['papa','maman'].forEach(w=>{let best=0,c=0;
      sl.forEach(s=>{c=(w==='papa'?s.fp:s.fm)?c+30:0;if(c>best)best=c});
      if(best>=180)runs[w].push({d,hd,len:best})});
    let bc=0,bb=0;sl.forEach(s=>{bc=(s.fp&&s.fm)?bc+30:0;if(bc>bb)bb=bc});
    if(bb>=120)duoRuns.push({d,hd,len:bb});
  });
  const longest={papa:{len:0,d:0},maman:{len:0,d:0}};
  for(let d=0;d<7;d++)['papa','maman'].forEach(w=>{let c=0;
    slots.filter(s=>s.d===d).forEach(s=>{c=(w==='papa'?s.fp:s.fm)?0:c+30;
      if(c>longest[w].len)longest[w]={len:c,d}})});
  const cost=pl.blocks.reduce((a,b)=>a+(+b.cost||0),0);
  return{slots,free,load,longest,runs,duoRuns,both,none,fam,cost,
    perH:both?cost/(both/60*4.33):0};
}

/*═══════════ header + chips ═══════════*/
function paintHeader(){
  const p=P(),c=engine(p);
  const t=p.kind==='real'?('Semaine du '+fdate(parseD(p.monday),{day:'numeric',month:'short'})):p.name;
  $('hTitle').innerHTML=esc(t)+(p.meta.vj&&p.meta.va?' <span class="tag ok">Accordé</span>':'');
  $('hSub').textContent=(p.kind==='real'?'semaine réelle · ':'semaine type · ')+
    c.cost+' €/mois · '+p.blocks.length+' blocs';
}
function paintChips(){
  const host=$('viewChips');
  if(tab!=='plan'){host.innerHTML='';return}
  const ids=S.order.filter(k=>S.plans[k]);
  host.innerHTML='<div class="chipwrap"><div class="chips" id="chipRow"></div></div>';
  const row=$('chipRow');
  ids.forEach(k=>{
    const p=S.plans[k],c=engine(p);
    const b=document.createElement('button');b.className='chip';
    b.setAttribute('aria-selected',k===S.active);
    const nm=p.kind==='real'?fdate(parseD(p.monday),{day:'numeric',month:'short'}):p.name;
    b.innerHTML='<b>'+esc(nm)+(p.meta.vj&&p.meta.va?' ✓':'')+'</b><small>'+c.cost+'€ · '+
      c.runs.papa.length+'+'+c.runs.maman.length+' demi-j · '+dur(c.both)+' à 2</small>';
    b.onclick=()=>{S.active=k;save();paint();};
    row.appendChild(b);
  });
  const g=document.createElement('button');g.className='chip gh';g.textContent='+';
  g.title='Dupliquer / nouvelle version';g.onclick=()=>dupSheet();
  row.appendChild(g);
}

/*═══════════ vue planning ═══════════*/
function paintPlan(){
  const p=P(),c=engine(p);
  const m=$('main');
  /* Le planning d'abord. Les outils (chiffres, légende, accord) viennent après,
     en second plan visuel. */
  m.innerHTML=
   '<div class="seg2 tools" style="margin-left:0;margin-right:0"><button id="mGrid" aria-selected="'+gridMode+'">Semaine</button>'+
   '<button id="mDay" aria-selected="'+(!gridMode)+'">Jour par jour</button></div>'+
   '<div id="body"></div>'+
   '<div class="leg tools" id="leg"></div>'+
   '<details class="fold tools" id="foldStats" open><summary>Ce que ça donne</summary>'+
     '<div class="stats" id="stats"></div><div class="panel" id="frictions"></div></details>'+
   '<details class="fold tools"><summary>✍️ Notre accord</summary>'+
     '<div class="opts g2" id="votes"></div>'+
     '<textarea id="note" placeholder="Ce qui coince, les conditions, à rediscuter…" style="margin-top:10px;width:100%;'+
     'background:var(--surf2);border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:15px;min-height:62px"></textarea></details>'+
   '<details class="fold tools"><summary>📐 Comment on compte</summary><div class="body" id="help"></div></details><div class="sp"></div>';
  $('mGrid').onclick=()=>{gridMode=true;paint()};
  $('mDay').onclick=()=>{gridMode=false;paint()};
  paintStats(c);paintLegend();
  gridMode?paintGrid():paintDays();
  paintFrictions(c);paintVotes();
  $('help').innerHTML=
   '<p>Deux adultes, deux enfants, chaque demi-heure de 7 h à 20 h 30. Un parent est <b>libre</b> s\'il ne tient aucun bloc '+
   'et qu\'aucun enfant ne lui reste sur les bras. L\'enfant qui n\'est dans aucun bloc va au <b>parent de garde</b> de la demi-journée '+
   '(réglable en vue Jour, et <b>Tous les deux</b> est un choix valable).</p>'+

/* ── gestes grille ── */
let G=null;
function bindEv(el,b){
  el.addEventListener('pointerdown',ev=>{
    if(ev.button)return;
    ev.stopPropagation();
    const grip=ev.target.dataset&&ev.target.dataset.grip;
    try{el.setPointerCapture(ev.pointerId)}catch(e){}
    G={mode:grip?'resize':'pending',el,b,x0:ev.clientX,y0:ev.clientY,
       s0:b.start,l0:b.len,d0:b.day,moved:false,pid:ev.pointerId,
       timer:grip?null:setTimeout(()=>{if(G&&G.mode==='pending'){G.mode='move';G.el.classList.add('lift');snap();buzz(14)}},330)};
    if(grip){snap();el.classList.add('lift')}
  },{passive:true});
}
function bindCol(col,d){
  col.addEventListener('pointerdown',ev=>{
    if(ev.button||G)return;
    const t=tOf(ev.offsetY);
    G={mode:'create',day:d,col,t0:t,t1:t+60,moved:false,pid:ev.pointerId,x0:ev.clientX,y0:ev.clientY};
    const g=document.createElement('div');g.className='ghost';g.id='ghost';
    g.style.top=y(t)+'px';g.style.height=y(t+60)-y(t)+'px';g.textContent=hmz(t);
    col.appendChild(g);
  },{passive:true});
}
addEventListener('pointermove',ev=>{
  if(!G)return;
  const dx=ev.clientX-G.x0,dy=ev.clientY-G.y0;
  if(!G.moved&&Math.abs(dx)+Math.abs(dy)>7)G.moved=true;
  if(G.mode==='pending'){
    if(G.moved){clearTimeout(G.timer);/* laisse défiler la page */ G=null;}
    return;
  }
  if(G.mode==='create'){
    if(!G.moved)return;
    const rect=G.col.getBoundingClientRect();
    const t=tOf(ev.clientY-rect.top);
    const a=Math.min(G.t0,t),z=Math.max(G.t0+SNAP,t);
    G.t1=z;G.tA=a;
    const g=$('ghost');if(g){g.style.top=y(a)+'px';g.style.height=Math.max(y(z)-y(a),20)+'px';
      g.textContent=hmz(a)+'–'+hmz(z)}
    ev.preventDefault();return;
  }
  if(G.mode==='move'){
    const over=[...document.querySelectorAll('.col')].find(c=>{
      const r=c.getBoundingClientRect();return ev.clientX>=r.left&&ev.clientX<=r.right});
    const st=clamp(Math.round((G.s0+dy/ROW*30)/SNAP)*SNAP,T0,T1-G.b.len);
    G.b.start=st;G.el.style.top=y(st)+'px';
    if(over){const nd=+over.dataset.day;G.b.day=nd;if(over!==G.el.parentNode)over.appendChild(G.el)}
    const m=G.el.querySelector('.m');
    if(m)m.textContent=hmz(st)+'–'+hmz(st+G.b.len)+' · '+WHO[G.b.owner].n;
    ev.preventDefault();return;
  }
  if(G.mode==='resize'){
    const ln=clamp(Math.round((G.l0+dy/ROW*30)/SNAP)*SNAP,SNAP,T1-G.b.start);
    G.b.len=ln;G.el.style.height=Math.max(y(G.b.start+ln)-y(G.b.start)-2,22)+'px';
    G.el.classList.toggle('mini',ln<=45);
    const m=G.el.querySelector('.m');
    if(m)m.textContent=hmz(G.b.start)+'–'+hmz(G.b.start+ln)+' · '+WHO[G.b.owner].n;
    ev.preventDefault();return;
  }
},{passive:false});
addEventListener('pointerup',ev=>{
  if(!G)return;const g=G;G=null;clearTimeout(g.timer);
  if(g.el)g.el.classList.remove('lift');
  const gh=$('ghost');if(gh)gh.remove();
  if(g.mode==='create'){
    if(g.moved&&g.tA!=null)openBlock(mk(g.day,g.tA,Math.max(g.t1-g.tA,SNAP),'','activite','papa','eloha'),true);
    else openBlock(mk(g.day,g.t0,60,'','activite','papa','eloha'),true);
    return;
  }
  if(g.mode==='pending'){openBlock(g.b);return}
  save();paintHeader();paintChips();
  const c=engine(P());paintStats(c);paintFrictions(c);
  toast(dur(g.b.len)+' · '+hmz(g.b.start)+' '+D3[g.b.day],{label:'Annuler',fn:undo});
});

function paintFrictions(c){
  const p=P(),o=[];
  const A=(i,t)=>o.push('<div class="alert"><span class="ai">'+i+'</span><span>'+t+'</span></div>');
  const nap=p.blocks.filter(b=>b.start<NAP[1]&&b.start+b.len>NAP[0]&&(b.kids==='both'||b.kids==='ael')&&b.kind!=='perso');
  if(nap.length)A('😴','<b>Sieste d\'Aël (12h30–14h30)</b> — '+nap.map(b=>esc(b.label)+' '+D3[b.day]).join(', ')+
    '. À trancher avant de valider : il dort sur place, ou il reste avec un parent et le gain de la demi-journée disparaît.');
  p.blocks.filter(b=>b.kind==='activite'&&!b.trip&&b.len>=150&&PARENTS.includes(b.owner)).forEach(b=>
    A('🚗','<b>'+esc(b.label)+' '+D3[b.day]+'</b> — '+dur(b.len)+' bloqués, trajet non renseigné. Remplis « dont trajet » : c\'est le seul moyen de voir si c\'est l\'activité ou la voiture qui mange la demi-journée.'));
  const gr=p.blocks.filter(b=>b.owner==='grapho');
  if(gr.length>1)A('💸','<b>Deux Grapho ('+gr.map(b=>D3[b.day]).join(', ')+')</b> — Grapho ne prend qu\'Éloha 1 h : un parent reste avec Aël <i>et</i> fait le taxi. Ça libère un parent, jamais les deux.');
  if(c.cost>0&&c.both===0)A('⚠️','<b>'+c.cost+' €/mois pour 0 h à deux.</b> Tout le budget part en solo alterné. Seul un bloc qui prend <i>les deux</i> enfants vous libère ensemble.');
  else if(c.cost>0&&c.perH>25)A('💸','<b>'+Math.round(c.perH)+' € l\'heure de temps à deux.</b> Au-delà de 25 €/h, un bloc de garde en plus vaut mieux que la même somme ailleurs.');
  if(p.blocks.filter(b=>b.kind==='ecole'&&b.day>=5).length>=2)
    A('📘','<b>École 7 jours sur 7</b> — aucun jour sans apprentissage formel. Rien ne l\'impose, et c\'est ce qui craque en premier.');
  const ec=Math.abs(c.load.papa-c.load.maman);
  if(ec>=240)A('⚖️','<b>Écart de garde '+dur(ec)+'</b> ('+dur(c.load.papa)+' Papa / '+dur(c.load.maman)+' Maman). Inverse un « parent de garde » en vue Jour pour rééquilibrer.');
  const w=c.longest.papa.len>=c.longest.maman.len?'papa':'maman';
  if(c.longest[w].len>=600)A('🥵','<b>'+WHO[w].n+' : journée entière de garde '+D3[c.longest[w].d]+'</b> ('+dur(c.longest[w].len)+' sans coupure, les deux enfants). Sur le papier ça libère l\'autre ; c\'est ce qui se négocie le plus mal le soir.');
  PARENTS.slice(0,2).forEach(x=>{if(c.runs[x].length<2)
    A('🧱','<b>'+WHO[x].n+' n\'a que '+c.runs[x].length+' demi-journée(s) de 3 h.</b> Des bouts d\'heure ne permettent pas de travailler : viser deux minimum chacun.')});
  if(c.fam===0)A('🏡','<b>Aucun temps tous les 4.</b> Mets une demi-journée en « Tous les deux » ou un bloc <i>En famille</i> : c\'est le seul truc que le planning oublie toujours.');
  if(!o.length)A('✅','<span class="good"><b>Rien à signaler</b> sur cette version. Elle tient debout.</span>');
  $('frictions').innerHTML='<h3>🔎 Points de friction <span class="tag">'+o.length+'</span></h3>'+o.join('');
}

/*═══════════ comparer ═══════════*/
function paintCompare(){
  const ids=S.order.filter(k=>S.plans[k]&&S.plans[k].blocks.length);
  const rows=ids.map(k=>({k,p:S.plans[k],c:engine(S.plans[k])}));
  const best={demi:Math.max(...rows.map(r=>r.c.runs.papa.length+r.c.runs.maman.length)),
              both:Math.max(...rows.map(r=>r.c.both)),
              cost:Math.min(...rows.map(r=>r.c.cost))};
  let h='<div class="panel"><h3>⇄ Comparer les versions</h3>'+
    '<p class="hint">Les demi-journées de 3 h sont le vrai carburant : en dessous on ne travaille pas. '+
    'Le prix ne se juge qu\'au regard du temps <b>à deux</b>, seul indicateur qu\'un tiers garde vraiment les deux enfants.</p>';
  rows.forEach(r=>{
    const nm=r.p.kind==='real'?'Semaine du '+fdate(parseD(r.p.monday),{day:'numeric',month:'short'}):r.p.name;
    const d=r.c.runs.papa.length+r.c.runs.maman.length;
    h+='<button class="wk" data-k="'+r.k+'" style="margin-bottom:9px">'+
      '<span class="cal" style="background:'+(r.k===S.active?'var(--ink)':'var(--surf2)')+';color:'+(r.k===S.active?'var(--bg)':'var(--ink)')+'">'+
      '<b>'+r.c.cost+'</b><small>€/mois</small></span>'+
      '<span class="bd"><b>'+esc(nm)+(r.p.meta.vj&&r.p.meta.va?' ✓':'')+'</b>'+
      '<span>'+r.c.runs.papa.length+' demi-j Papa · '+r.c.runs.maman.length+' Maman'+
      (d===best.demi?' 🥇':'')+'</span>'+
      '<span class="steps"><span class="tag'+(r.c.both===best.both&&r.c.both?' ok':'')+'">'+dur(r.c.both)+' à deux</span>'+
      '<span class="tag">'+dur(r.c.fam)+' tous les 4</span>'+
      (r.c.cost===best.cost?'<span class="tag ok">moins cher</span>':'')+'</span></span></button>';
  });
  h+='</div>';
  h+='<div class="panel"><h3>📊 Détail</h3>';
  const met=[['Coût €/mois','cost',v=>v+' €'],['Demi-j. Papa ≥3h','dp',v=>v],['Demi-j. Maman ≥3h','dm',v=>v],
    ['À deux sans enfants','both',dur],['Tous les 4','fam',dur],['Garde Papa','lp',dur],['Garde Maman','lm',dur],
    ['Écart de garde','ec',dur]];
  const val=r=>({cost:r.c.cost,dp:r.c.runs.papa.length,dm:r.c.runs.maman.length,both:r.c.both,fam:r.c.fam,
    lp:r.c.load.papa,lm:r.c.load.maman,ec:Math.abs(r.c.load.papa-r.c.load.maman)});
  met.forEach(([lbl,key,fmt])=>{
    h+='<div class="kv"><span class="mut">'+lbl+'</span><b>'+rows.map(r=>{
      const nm=r.p.kind==='real'?('sem. '+fdate(parseD(r.p.monday),{day:'numeric',month:'short'})):r.p.name.split(' ')[0];
      return nm+' '+fmt(val(r)[key])}).join(' · ')+'</b></div>';
  });
  h+='</div><div class="sp"></div>';
  $('main').innerHTML=h;
  $('main').querySelectorAll('.wk[data-k]').forEach(b=>b.onclick=()=>{
    S.active=b.dataset.k;tab='plan';save();paint();scrollTo({top:0})});
}

/*═══════════ à venir ═══════════*/
function paintNext(){
  const reals=S.order.map(k=>S.plans[k]).filter(p=>p&&p.kind==='real');
  const types=S.order.filter(k=>S.plans[k]&&S.plans[k].kind==='type'&&S.plans[k].blocks.length);
  let h='<div class="panel"><h3>🗓 Les vraies semaines</h3>'+
   '<p class="hint">On passe du débat au concret : on part d\'une version type, on l\'ajuste pour la semaine, '+
   'et on la valide à deux. Tant que les deux ✅ ne sont pas là, la semaine reste un brouillon.</p>';
  for(let i=0;i<6;i++){
    const md=monday(i),key=iso(md);
    const ex=S.order.find(k=>S.plans[k]&&S.plans[k].kind==='real'&&S.plans[k].monday===key);
    const end=new Date(md);end.setDate(end.getDate()+6);
    const lbl=fdate(md,{day:'numeric',month:'short'})+' → '+fdate(end,{day:'numeric',month:'short'});
    if(ex){
      const p=S.plans[ex],c=engine(p);
      h+='<button class="wk'+(i===0?' cur':'')+'" data-open="'+ex+'">'+
        '<span class="cal"><b>'+md.getDate()+'</b><small>'+fdate(md,{month:'short'}).slice(0,4)+'</small></span>'+
        '<span class="bd"><b>'+(i===0?'Cette semaine':i===1?'Semaine prochaine':lbl)+'</b>'+
        '<span>'+lbl+' · '+c.cost+' € · '+p.blocks.length+' blocs</span>'+
        '<span class="steps"><span class="dotv'+(p.meta.vj?' on':'')+'"></span>Jonathan'+
        '<span class="dotv'+(p.meta.va?' on':'')+'"></span>Aurélie'+
        (p.meta.vj&&p.meta.va?'<span class="tag ok">Accordée</span>':'<span class="tag">brouillon</span>')+
        '</span></span></button>';
    }else{
      h+='<button class="wk empty" data-new="'+key+'">'+
        '<span class="cal"><b>'+md.getDate()+'</b><small>'+fdate(md,{month:'short'}).slice(0,4)+'</small></span>'+
        '<span class="bd"><b>'+(i===0?'Cette semaine':i===1?'Semaine prochaine':lbl)+'</b>'+
        '<span>'+lbl+' · à créer depuis une version type</span></span><span style="font-size:22px;color:var(--mut)">+</span></button>';
    }
  }
  h+='</div>';
  if(!types.length)h+='<div class="panel"><p class="hint">Aucune version type avec des blocs : crée-en une dans l\'onglet Planning.</p></div>';
  h+='<div class="sp"></div>';
  $('main').innerHTML=h;
  $('main').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    S.active=b.dataset.open;tab='plan';save();paint();scrollTo({top:0})});
  $('main').querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>newReal(b.dataset.new));
}
function newReal(key){
  const types=S.order.filter(k=>S.plans[k]&&S.plans[k].kind==='type'&&S.plans[k].blocks.length);
  const md=parseD(key);
  sheet('<div class="sh-h"><h3>Semaine du '+fdate(md)+'</h3></div>'+
   '<p class="hint">On part de quelle version ? Tu pourras tout ajuster ensuite, ça ne touche pas la version type.</p>'+
   '<div class="opts" style="flex-direction:column">'+types.map(k=>{
     const c=engine(S.plans[k]);
     return '<button data-k="'+k+'" style="justify-content:flex-start">'+
       '<span class="dot" style="background:var(--ink)">'+c.cost+'</span><span style="text-align:left">'+
       esc(S.plans[k].name)+'<br><small class="mut">'+c.runs.papa.length+'+'+c.runs.maman.length+
       ' demi-j · '+dur(c.both)+' à deux · '+c.cost+' €</small></span></button>'}).join('')+'</div>');
  $('pane').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    const src=S.plans[b.dataset.k],k=nid('w'),p=clone(src);
    p.kind='real';p.monday=key;p.name='Semaine du '+fdate(md,{day:'2-digit',month:'2-digit'});
    p.blocks.forEach(x=>x.id=nid());p.meta={vj:false,va:false,note:''};p.from=src.name;
    S.plans[k]=p;S.order.push(k);S.active=k;tab='plan';save();close();paint();
    toast('Semaine créée depuis « '+src.name+' »');
  });
}

/*═══════════ sheets ═══════════*/
function sheet(html){$('pane').innerHTML=html;$('sheet').classList.add('on')}
function close(){$('sheet').classList.remove('on')}
function optRow(id,items,val,cls){
  return '<div class="opts '+(cls||'')+'" id="'+id+'">'+items.map(o=>
    '<button data-v="'+o.v+'" aria-pressed="'+(o.v===val)+'"'+(o.c?' style="--c:'+o.c+';--s:'+o.s+';--cc:'+o.c+'"':'')+'>'+
    (o.dot?'<span class="dot" style="background:'+o.c+'">'+o.dot+'</span>':(o.e?o.e+' ':''))+o.n+'</button>').join('')+'</div>';
}
function openBlock(b,isNew){
  const whoItems=Object.keys(WHO).map(w=>({v:w,n:WHO[w].n,c:cvar(w),s:svar(w),dot:WHO[w].s}));
  const kindItems=Object.keys(KIND).map(k=>({v:k,n:KIND[k].n,e:KIND[k].e}));
  const kidItems=Object.keys(KIDS).map(k=>({v:k,n:KIDS[k].n}));
  const dayItems=D3.map((n,i)=>({v:String(i),n:D1[i]}));
  let opts='';for(let t=T0;t<=T1-SNAP;t+=SNAP)opts+='<option value="'+t+'"'+(t===b.start?' selected':'')+'>'+hmz(t)+'</option>';
  sheet('<div class="grab"></div>'+
   '<div class="sh-h"><h3>'+(isNew?'Nouveau bloc':'Modifier')+'</h3>'+
     '<button class="ib" id="xClose">✕</button></div>'+
   '<div class="fld"><label>Quoi</label><input type="text" id="fL" value="'+esc(b.label)+'" placeholder="Ninja, école maison, Gaëlle…" autocomplete="off"></div>'+
   '<div class="fld"><label>Type</label>'+optRow('fK',kindItems,b.kind,'g3')+'</div>'+
   '<div class="fld"><label>Qui s\'en occupe</label>'+optRow('fO',whoItems,b.owner,'g2')+'</div>'+
   '<div class="fld"><label>Avec quel enfant</label>'+optRow('fC',kidItems,b.kids,'g3')+'</div>'+
   '<div class="fld"><label>Jour</label>'+optRow('fD',dayItems,String(b.day),'g7')+'</div>'+
   '<div class="duo2"><div class="fld"><label>Début</label><select id="fS">'+opts+'</select></div>'+
   '<div class="fld"><label>Durée (trajets inclus)</label><div class="step">'+
     '<button id="fLm">−</button><span id="fLv">'+dur(b.len)+'</span><button id="fLp">+</button></div></div></div>'+
   '<div class="duo2"><div class="fld"><label>Dont trajet A/R</label><div class="step">'+
     '<button id="fTm">−</button><span id="fTv">'+dur(b.trip||0)+'</span><button id="fTp">+</button></div></div>'+
   '<div class="fld"><label>Coût €/mois</label><input type="number" id="fP" inputmode="numeric" min="0" step="10" value="'+(b.cost||0)+'"></div></div>'+
   '<div class="btns">'+(isNew?'':'<button class="bt danger" id="fDel">Supprimer</button>')+
     '<button class="bt primary" id="fOk">'+(isNew?'Ajouter':'Enregistrer')+'</button></div>');
  const st=Object.assign({},b);
  $('xClose').onclick=close;
  const wire=(id,key,after)=>{const el=$(id);el.onclick=e=>{
    const t=e.target.closest('button');if(!t)return;
    [...el.children].forEach(c=>c.setAttribute('aria-pressed',c===t));
    st[key]=t.dataset.v;buzz(5);if(after)after()}};
  wire('fK','kind',()=>{if(st.kind==='famille'){st.owner='duo';st.kids='both';
    [...$('fO').children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.v==='duo'));
    [...$('fC').children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.v==='both'))}});
  wire('fO','owner',()=>{const p=$('fP');
    if(PAID[st.owner]!=null&&!+p.value)p.value=PAID[st.owner];
    if(PARENTS.includes(st.owner))p.value=0});
  wire('fC','kids');wire('fD','day');
  const bump=(key,span,d,mn,mx)=>{st[key]=clamp((+st[key]||0)+d,mn,mx);$(span).textContent=dur(st[key]);buzz(4)};
  $('fLm').onclick=()=>bump('len',  'fLv',-15,15,T1-T0);
  $('fLp').onclick=()=>bump('len',  'fLv', 15,15,T1-T0);
  $('fTm').onclick=()=>bump('trip','fTv',-15, 0,600);
  $('fTp').onclick=()=>bump('trip','fTv', 15, 0,600);
  if(!isNew)$('fDel').onclick=()=>{
    snap();const p=P(),rm=p.blocks.find(x=>x.id===b.id);
    p.blocks=p.blocks.filter(x=>x.id!==b.id);save();close();paint();
    toast('« '+(rm?rm.label:'Bloc')+' » supprimé',{label:'Annuler',fn:undo})};
  $('fOk').onclick=()=>{
    snap();
    Object.assign(b,st,{label:($('fL').value||'').trim()||'Sans titre',day:+st.day,
      start:+$('fS').value,cost:+$('fP').value||0});
    b.len=clamp(b.len,15,T1-b.start);b.trip=Math.min(b.trip||0,b.len);
    if(isNew)P().blocks.push(b);
    save();close();paint();buzz(10);
    toast(isNew?'Bloc ajouté':'Modifié',{label:'Annuler',fn:undo});
  };
  setTimeout(()=>{if(isNew)$('fL').focus()},260);
}
function dupSheet(){
  sheet('<div class="grab"></div><div class="sh-h"><h3>Nouvelle version</h3><button class="ib" id="xC">✕</button></div>'+
   '<div class="mlist">'+
   '<button id="dDup"><span class="mi">⧉</span><div>Dupliquer « '+esc(P().name)+' »<small>tester une variante sans casser celle-ci</small></div></button>'+
   '<button id="dNew"><span class="mi">＋</span><div>Partir d\'une page blanche<small>construire une semaine de zéro</small></div></button>'+
   '<button id="dWeek"><span class="mi">🗓</span><div>Créer une vraie semaine<small>la semaine prochaine, à valider à deux</small></div></button>'+
   '<button id="dImp"><span class="mi">↓</span><div>Importer un code reçu<small>coller ce qu\'Aurélie a envoyé</small></div></button></div>');
  $('xC').onclick=close;
  $('dDup').onclick=()=>{const k=nid('p'),p=clone(P());
    p.name=P().name+' bis';p.kind='type';delete p.monday;
    p.blocks.forEach(b=>b.id=nid());p.meta={vj:false,va:false,note:''};
    S.plans[k]=p;S.order.push(k);S.active=k;save();close();paint();rename()};
  $('dNew').onclick=()=>{const k=nid('p');
    S.plans[k]={name:'Nouvelle',kind:'type',blocks:[],duty:DUTY(),meta:{vj:false,va:false,note:''}};
    S.order.push(k);S.active=k;save();close();paint();rename()};
  $('dWeek').onclick=()=>{close();tab='next';paint()};
  $('dImp').onclick=importSheet;
}
function rename(){
  const p=P();
  sheet('<div class="grab"></div><div class="sh-h"><h3>Nommer</h3><button class="ib" id="xC">✕</button></div>'+
   '<div class="fld"><label>Nom de la version</label><input type="text" id="rN" value="'+esc(p.name)+'"></div>'+
   (p.kind==='real'?'<div class="fld"><label>Lundi de la semaine</label><input type="date" id="rD" value="'+(p.monday||'')+'"></div>':'')+
   '<div class="btns"><button class="bt primary" id="rOk">Enregistrer</button></div>');
  $('xC').onclick=close;
  $('rOk').onclick=()=>{p.name=($('rN').value||'').trim()||p.name;
    if($('rD')&&$('rD').value)p.monday=$('rD').value;save();close();paint()};
}
function menu(){
  const p=P();
  sheet('<div class="grab"></div><div class="sh-h"><h3>'+esc(p.name)+'</h3><button class="ib" id="xC">✕</button></div>'+
   '<div class="mlist">'+
   '<button id="mRen"><span class="mi">✎</span><div>Renommer<small>'+(p.kind==='real'?'semaine réelle':'semaine type')+'</small></div></button>'+
   '<button id="mDup"><span class="mi">⧉</span><div>Dupliquer / nouvelle version</div></button>'+
   '<button id="mExp"><span class="mi">↗</span><div>Envoyer à Aurélie<small>lien ou code</small></div></button>'+
   '<button id="mImp"><span class="mi">↓</span><div>Importer un code reçu</div></button>'+
   '<button id="mPdf"><span class="mi">🖨</span><div>Imprimer / PDF<small>la grille de la semaine</small></div></button>'+
   '<button id="mDel"><span class="mi">🗑</span><div>Supprimer cette version</div></button>'+
   '<button id="mRst"><span class="mi">⟲</span><div>Tout réinitialiser<small>revenir aux 5 versions de départ</small></div></button></div>');
  $('xC').onclick=close;
  $('mRen').onclick=rename;$('mDup').onclick=dupSheet;$('mExp').onclick=shareSheet;$('mImp').onclick=importSheet;
  $('mPdf').onclick=()=>{close();gridMode=true;paint();setTimeout(()=>print(),320)};
  $('mDel').onclick=()=>{
    if(S.order.filter(k=>S.plans[k]).length<2)return toast('Il faut garder une version');
    if(!confirm('Supprimer « '+p.name+' » ?'))return;
    delete S.plans[S.active];S.order=S.order.filter(k=>k!==S.active);
    S.active=S.order[0];save();close();paint()};
  $('mRst').onclick=()=>{if(!confirm('Tout remettre à zéro ? Les versions personnalisées seront perdues.'))return;
    localStorage.removeItem(KEY);S=boot();undoStack=[];save();close();paint()};
}
/* partage */
const pack=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unpack=s=>JSON.parse(decodeURIComponent(escape(atob(String(s).replace(/-/g,'+').replace(/_/g,'/')))));
function shareSheet(){
  const p=P(),code=pack({t:'p3',p}),url=location.origin+location.pathname+'#p='+code;
  const local=location.protocol==='file:';
  sheet('<div class="grab"></div><div class="sh-h"><h3>Envoyer « '+esc(p.name)+' »</h3><button class="ib" id="xC">✕</button></div>'+
   '<p class="hint">'+(local?'Page ouverte en local : envoie le <b>code</b>, à coller dans « Importer ».':
     'Elle ouvre le lien, voit exactement cette version, la modifie et te la renvoie. Rien ne s\'écrase.')+'</p>'+
   '<div class="fld"><label>'+(local?'Code':'Lien')+'</label><textarea id="sT" readonly style="min-height:72px;font-size:12px">'+
     esc(local?code:url)+'</textarea></div>'+
   '<div class="btns"><button class="bt" id="sC">Copier</button><button class="bt primary" id="sS">Partager…</button></div>');
  $('xC').onclick=close;
  const grab=async()=>{const t=$('sT');t.select();
    try{await navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}
    toast('Copié')};
  $('sC').onclick=grab;
  $('sS').onclick=async()=>{
    try{await navigator.share(local?{title:'Semaine type',text:code}:{title:'Semaine — '+p.name,url})}
    catch(e){grab()}};
}
function importSheet(){
  sheet('<div class="grab"></div><div class="sh-h"><h3>Importer</h3><button class="ib" id="xC">✕</button></div>'+
   '<p class="hint">Colle le lien ou le code reçu. La version s\'ajoute à la liste, rien n\'est remplacé.</p>'+
   '<div class="fld"><textarea id="iT" style="min-height:92px;font-size:12px" placeholder="https://…#p=…  ou le code brut"></textarea></div>'+
   '<div class="btns"><button class="bt primary" id="iOk">Importer</button></div>');
  $('xC').onclick=close;
  $('iOk').onclick=()=>{
    let v=($('iT').value||'').trim();const m=v.match(/#p=([^\s&]+)/);if(m)v=m[1];
    try{const o=unpack(v),p=(o&&(o.t==='p3'||o.t==='plan'))?o.p:o;
      if(!p||!p.blocks)throw 0;adopt(p);close();paint();toast('Version importée')}
    catch(e){toast('Code illisible')}
  };
}
function adopt(p){
  const k=nid('r');
  p.blocks=(p.blocks||[]).map(b=>Object.assign({id:nid(),kids:'eloha',cost:0,trip:0},b,
    {len:b.len||b.dur||60}));
  p.kind=p.kind||(p.monday?'real':'type');p.duty=p.duty||DUTY();
  p.meta=Object.assign({vj:false,va:false,note:''},p.meta||{});
  if(S.order.some(x=>S.plans[x]&&S.plans[x].name===p.name))p.name+=' (reçue)';
  S.plans[k]=p;S.order.push(k);S.active=k;tab='plan';save();
}

/*═══════════ paint / nav ═══════════*/
function paint(){
  paintHeader();paintChips();
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  $('fab').style.display=tab==='plan'?'grid':'none';
  if(paysage()&&tab==='plan')gridMode=true;   /* paysage = vue semaine plein écran */
  if(tab==='plan')paintPlan();else if(tab==='cmp')paintCompare();else paintNext();
  rotHint();
  S.tab=tab;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;save();paint();scrollTo({top:0,behavior:'smooth'});buzz(6)});
$('fab').onclick=()=>{
  const d=(new Date().getDay()+6)%7;
  openBlock(mk(P().kind==='real'?d:0,10*60,60,'','activite','papa','eloha'),true)};
$('bMenu').onclick=menu;
$('bShare').onclick=shareSheet;
$('bUndo').onclick=undo;
$('sheet').querySelector('.veil').onclick=close;
addEventListener('keydown',e=>{if(e.key==='Escape')close();
  if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();undo()}});

/* lien entrant (au chargement ET si on ouvre un lien alors que l'app est deja ouverte) */
function incoming(){
  const m=location.hash.match(/^#p=(.+)$/);if(!m)return;
  let p=null;try{const o=unpack(m[1]);p=(o&&(o.t==='p3'||o.t==='plan'))?o.p:o}catch(e){}
  history.replaceState(null,'',location.pathname);
  if(!p||!p.blocks)return;
  setTimeout(()=>{
    const c=engine(Object.assign({duty:DUTY()},p));
    sheet('<div class="grab"></div><div class="sh-h"><h3>Version reçue</h3></div>'+
     '<p class="hint"><b>'+esc(p.name||'Sans nom')+'</b> · '+p.blocks.length+' blocs · '+c.cost+
     ' €/mois. Elle s\'ajoutera à tes versions, rien n\'est écrasé.</p>'+
     '<div class="btns"><button class="bt" id="zNo">Plus tard</button>'+
     '<button class="bt primary" id="zOk">Ajouter</button></div>');
    $('zNo').onclick=close;
    $('zOk').onclick=()=>{adopt(p);close();paint();toast('Version ajoutée')};
  },80);
}
incoming();
addEventListener('hashchange',incoming);

/* bandeau rotation : en vue Semaine, en portrait, tant qu'on ne l'a pas masqué */
function paysage(){return matchMedia('(orientation:landscape) and (max-height:520px)').matches}
function rotHint(){
  const el=$('rot');if(!el)return;
  const off=localStorage.getItem('rot-off')==='1';
  el.classList.toggle('show', gridMode && tab==='plan' && !off);
}
$('rotX').onclick=()=>{localStorage.setItem('rot-off','1');$('rot').classList.remove('show')};
addEventListener('orientationchange',()=>setTimeout(()=>{paint()},150));

tab=S.tab||'plan';
paint();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
